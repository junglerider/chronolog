name: Chronolog CI
env:
  IMAGE_NAME: chronolog

on:
  # Run CI for pushes to every branch or tag.
  push:
  # Run CI for pull requests targeting every branch.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test_and_build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Install the API's locked dependencies.
      - run: npm ci --prefix ./api
      # Verify API behavior before building the production bundle.
      - run: npm test --prefix ./api
      # Compile the API TypeScript sources for the container image.
      - run: npm run build --prefix ./api
      # Install the frontend's locked dependencies.
      - run: npm ci --prefix ./app
      # Enforce frontend lint rules.
      - run: npm run lint --prefix ./app
      # Run the frontend unit tests.
      - run: npm run test:unit --prefix ./app
      # Build the static frontend served by the API.
      - run: npm run build --prefix ./app
      # Install Chromium and operating-system dependencies for browser tests.
      - run: npx playwright install --with-deps --no-shell chromium
        working-directory: ./app
      # Exercise the frontend in a real browser.
      - run: npm run test:e2e --prefix ./app

      # Generate the demo database included in the production image.
      - name: Create demo database
        run: ./build db --force

      # Assemble the deployable production image from the API and frontend builds.
      - name: Build image
        run: docker build . --file Dockerfile --tag $IMAGE_NAME

      # Check the image's health, frontend routes, and demo admin's passwordless login flow.
      - name: Smoke test container
        run: |
          set -euo pipefail
          container_name=chronolog-smoke
          admin_password=$(openssl rand -hex 32)
          docker run --detach --name "$container_name" --publish 127.0.0.1::5404 \
            "$IMAGE_NAME"
          trap 'docker rm --force "$container_name" >/dev/null' EXIT
          port=$(docker port "$container_name" 5404/tcp | sed 's/.*://')
          base_url="http://127.0.0.1:$port"
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$base_url/health" | grep -q '"status":"ready"'; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "$base_url/health" | grep -q '"status":"ready"'
          curl --fail --silent "$base_url/" | grep -q '<div id="app"></div>'
          curl --fail --silent "$base_url/time-sheet" | grep -q '<div id="app"></div>'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
            --header 'Content-Type: application/json' \
            --data '{"username":"__ci_smoke_unknown__","password":"invalid"}' \
            "$base_url/auth/login")
          test "$status" = 404
          admin_login=$(curl --fail --silent --request POST \
            --header 'Content-Type: application/json' \
            --data '{"username":"enzo","password":""}' \
            "$base_url/auth/login")
          admin_token=$(printf '%s' "$admin_login" | jq -er '.token')
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --request DELETE \
            --header "Authorization: Bearer $admin_token" \
            "$base_url/api/user/1/password")
          test "$status" = 204
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
            --header 'Content-Type: application/json' \
            --data '{"username":"enzo","password":""}' \
            "$base_url/auth/login")
          test "$status" = 200
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --request PUT \
            --header "Authorization: Bearer $admin_token" \
            --header 'Content-Type: application/json' \
            --data "{\"oldPassword\":\"\",\"password\":\"$admin_password\"}" \
            "$base_url/api/user/1/password")
          test "$status" = 204
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
            --header 'Content-Type: application/json' \
            --data '{"username":"enzo","password":""}' \
            "$base_url/auth/login")
          test "$status" = 401
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
            --header 'Content-Type: application/json' \
            --data "{\"username\":\"enzo\",\"password\":\"$admin_password\"}" \
            "$base_url/auth/login")
          test "$status" = 200
          unset admin_login admin_token
          unset admin_password

      # Confirm a release tag points to a commit already merged into master.
      - name: Verify release tag is on master
        id: release_tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags --unshallow origin master
          if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "is_on_master=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_on_master=false" >> "$GITHUB_OUTPUT"
          fi

      # Authenticate only for a v-prefixed tag push.
      - name: Log into registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && steps.release_tag.outputs.is_on_master == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login docker.pkg.github.com -u ${{ github.actor }} --password-stdin

      # Publish a v-prefixed tag as its version, without publishing branch pushes or pull requests.
      - name: Push image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && steps.release_tag.outputs.is_on_master == 'true'
        run: |
          image_id="docker.pkg.github.com/${{ github.repository }}/$IMAGE_NAME"
          image_id=$(printf '%s' "$image_id" | tr '[:upper:]' '[:lower:]')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF##*/}"
            version="${version#v}"
          else
            version=latest
          fi

          echo "Publishing $image_id:$version"
          docker tag "$IMAGE_NAME" "$image_id:$version"
          docker push "$image_id:$version"
